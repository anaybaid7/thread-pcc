name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Engine, API and web
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: thread
          POSTGRES_PASSWORD: thread
          POSTGRES_DB: thread_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U thread"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Tests (embedded PostgreSQL, wire protocol, and a real PostgreSQL server)
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://thread:thread@localhost:5432/thread_test
      - run: npm run lint
      - run: npm run build

  e2e:
    name: Browser tests (saved, practice, phone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build both web modes
        run: npm run build:e2e
      - name: Play the game in Chromium
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
