[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "thread-pcc"
version = "0.1.0"
description = "THREAD: evidence-linked concern threads for long-term care (hackathon prototype, synthetic data only)"
requires-python = ">=3.11"
dependencies = [
  "pydantic==2.13.5",
  "fastapi==0.142.2",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.16.10"]

[project.scripts]
thread = "thread_engine.cli:main"

[tool.setuptools.packages.find]
where = ["engine", "api"]

[tool.pytest.ini_options]
testpaths = ["engine/tests", "api/tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["thread_engine", "thread_api"]

[tool.ruff.lint.per-file-ignores]
"*/tests/*" = ["E501"]
